<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미니게임 모음</title>
<meta name="description" content="설치 없이 브라우저에서 바로 플레이하는 미니게임 모음">
<style>
    :root {
        --bg: #14161f;
        --card: #1e2130;
        --card-hover: #262a3d;
        --border: #333a52;
        --text: #f2f4f8;
        --muted: #99a0b5;
        --accent: #f1c40f;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 40px 20px 60px;
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 720px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 36px; }

    h1 {
        margin: 0 0 10px;
        font-size: 2rem;
        color: var(--accent);
        text-shadow: 0 0 18px rgba(241, 196, 15, 0.25);
    }

    header p { margin: 0; color: var(--muted); font-size: 0.95rem; }

    .games {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
    }

    .game {
        display: block;
        padding: 22px;
        background: var(--card);
        border: 2px solid var(--border);
        border-radius: 16px;
        text-decoration: none;
        color: inherit;
        transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }

    .game:hover,
    .game:focus-visible {
        background: var(--card-hover);
        border-color: var(--accent);
        transform: translateY(-3px);
        outline: none;
    }

    .emoji { font-size: 2.4rem; line-height: 1; }

    .game h2 { margin: 12px 0 6px; font-size: 1.15rem; }

    .game p { margin: 0 0 14px; color: var(--muted); font-size: 0.88rem; line-height: 1.5; }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; }

    .tag {
        font-size: 0.72rem;
        padding: 3px 9px;
        border-radius: 999px;
        background: rgba(241, 196, 15, 0.12);
        color: var(--accent);
        border: 1px solid rgba(241, 196, 15, 0.3);
    }

    footer {
        margin-top: 40px;
        text-align: center;
        color: var(--muted);
        font-size: 0.8rem;
    }

    footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>미니게임 모음</h1>
        <p>설치 없이 브라우저에서 바로 플레이하세요</p>
    </header>

    <main class="games">
        <a class="game" href="mole/">
            <div class="emoji">🔨</div>
            <h2>귀여운 두더지 잡기</h2>
            <p>30초 안에 두더지를 잡아 점수를 올리세요. 피버 타임에 들어가면 두더지가 한꺼번에 쏟아지고 황금 두더지 확률도 올라갑니다.</p>
            <div class="tags">
                <span class="tag">피버타임 에디션</span>
                <span class="tag">순간 반응</span>
            </div>
        </a>

        <a class="game" href="pocket/">
            <div class="emoji">⚔️</div>
            <h2>포켓몬 레전드: 히스이의 전설</h2>
            <p>포켓몬을 포획하고 육성해 전설의 보스와 배틀리그 극악 AI에 도전하는 턴제 RPG입니다.</p>
            <div class="tags">
                <span class="tag">엔드 콘텐츠 확장판</span>
                <span class="tag">턴제 RPG</span>
            </div>
        </a>
    </main>

    <footer>
        <p>소스: <a href="https://github.com/iwanjin/mole-fever-game">github.com/iwanjin/mole-fever-game</a></p>
    </footer>
</div>
</body>
</html>
