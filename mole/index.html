<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>귀여운 두더지 잡기 게임 - 피버타임 에디션</title>
    <style>
        /* ============================================================
           두더지 잡기 — 유동 레이아웃 + 초등학생 친화 디자인
           - 길이는 clamp()/%/aspect-ratio 로만 잡아서 320px~와이드까지 대응
           - 게임판은 width: min(100%, --board-max) 하나로 크기 결정,
             구멍/두더지/얼굴 글자는 모두 게임판 크기에 비례 (cqw 사용)
           ============================================================ */
        :root {
            /* --- 색상 팔레트 (밝은 하늘 + 잔디, 포인트는 노랑/주황/보라) --- */
            --sky-1: #5ecdff;
            --sky-2: #a9eaff;
            --sky-3: #bdf28d;
            --ink: #2f2a56;          /* 본문 진한 남보라 — 흰 카드 위에서 대비 12:1 이상 */
            --ink-soft: #5f5a86;
            --yellow: #ffd23f;
            --orange: #ff8a3d;
            --deep-orange: #e2571a;
            --purple: #7c4dff;
            --card: rgba(255, 255, 255, 0.94);

            /* --- 레이아웃 --- */
            --page-pad: clamp(10px, 3vw, 24px);
            --gap: clamp(6px, 1.8vw, 14px);
            --radius: 18px;
            /* 게임판 최대 폭: 스크롤 없이 들어오게 화면 세로에서 역산한다.
               3열 x 4행이라 판 높이 = 폭 x 4/3, 즉 폭 = 남은 높이 x 0.75 */
            --ui-h: 25.5rem; /* 제목+정보+상점+시작 버튼이 쓰는 세로 길이 (실측값) */
            --board-max: min(30rem, max(12rem, (100vh - var(--ui-h)) * 0.75));
            --board-max: min(30rem, max(12rem, (100svh - var(--ui-h)) * 0.75));
        }

        * { box-sizing: border-box; }

        html {
            /* 피버 타임 shake 가 가로 스크롤바를 만들지 않게 잘라낸다.
               세로 스크롤(순위표)은 그대로 살아있다. */
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Trebuchet MS', 'Segoe UI', system-ui, -apple-system, sans-serif;
            text-align: center;
            background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 46%, var(--sky-3) 100%) fixed;
            color: var(--ink);
            margin: 0;
            padding: var(--page-pad) var(--page-pad) calc(var(--page-pad) * 2.5);
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* 피버 타임 배경 효과 — 붉은 화면을 오버레이로 깔아 부드럽게 전환.
           밝은 평상시 화면 ↔ 어두운 붉은 화면의 대비를 크게 유지한다. */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #ff5252 0%, #c62828 55%, #7f0000 100%);
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
            z-index: -1;
        }

        body.fever::before { opacity: 1; }

        /* 흔들림은 게임 화면에만 적용해서 상단 목록 링크는 고정 */
        body.fever #stage {
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            25% { transform: translate(-1px, -2px) rotate(-1deg); }
            50% { transform: translate(-3px, 0px) rotate(1deg); }
            75% { transform: translate(3px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -1px) rotate(0deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            body.fever #stage { animation: none; }
            .mole.gold .face::after { animation: none; opacity: 0.85; }
        }

        /* 좌측 상단 목록 링크 (#stage 밖 / position: fixed 유지) */
        .back-link {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.92);
            border: 2px solid rgba(47, 42, 86, 0.15);
            color: var(--ink);
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.18);
        }

        #stage {
            max-width: 40rem;
            margin: 0 auto;
            padding-top: clamp(46px, 9vw, 58px); /* 고정 목록 링크와 겹치지 않게 */
        }

        h1 {
            font-size: clamp(1.3rem, 5.4vw, 2.2rem);
            color: #fff;
            text-shadow: -2px -2px 0 var(--deep-orange), 2px -2px 0 var(--deep-orange),
                         -2px 2px 0 var(--deep-orange), 2px 2px 0 var(--deep-orange),
                         0 5px 0 rgba(0, 0, 0, 0.2);
            margin: 0 0 clamp(8px, 2vw, 16px);
        }

        /* ===== 정보 패널 ===== */
        .info-panel {
            background: var(--card);
            border: 3px solid #fff;
            border-radius: var(--radius);
            padding: clamp(10px, 2.6vw, 15px);
            width: min(100%, 30rem);
            margin: 0 auto clamp(10px, 2.2vw, 14px);
            box-shadow: 0 4px 0 rgba(47, 42, 86, 0.16);
            font-size: clamp(1rem, 3.6vw, 1.2rem);
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(6px, 2vw, 12px);
        }

        .stat {
            flex: 1 1 5.2rem;
            min-width: 4.6rem;
            background: #fff6da;
            border: 2px solid #ffe6a6;
            border-radius: 12px;
            padding: 6px 8px;
            line-height: 1.2;
        }

        .stat-label {
            display: block;
            white-space: nowrap;
            font-size: 0.74em;
            font-weight: bold;
            color: var(--ink-soft);
        }

        .stat-value {
            font-size: 1.4em;
            font-weight: 900;
            color: var(--deep-orange);
        }

        .stat-unit { font-size: 0.85em; font-weight: bold; color: var(--ink-soft); }

        .stat.stat-score .stat-value { color: var(--purple); }
        .stat.stat-time .stat-value { color: #1565c0; }
        body.fever .stat.stat-time .stat-value { color: #d50000; }

        .best-line {
            margin-top: 10px;
            font-size: 0.92em;
            font-weight: bold;
            color: var(--ink-soft);
        }

        .best-line span { color: var(--deep-orange); }

        /* ===== 피버 알림 / 플로팅 텍스트 =====
           둘 다 position: fixed — 스크롤 길이에 영향을 주지 않는다. */
        .fever-alert {
            position: fixed;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(2.3rem, 13vw, 5rem);
            font-weight: 900;
            color: #fff700;
            text-shadow: 0 0 18px #ff3d00, 0 4px 0 #b71c1c, 0 0 44px rgba(255, 61, 0, 0.9);
            pointer-events: none;
            opacity: 0;
            z-index: 100;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .fever-alert.show {
            opacity: 1;
            animation: zoomInOut 0.8s infinite alternate;
        }

        @keyframes zoomInOut {
            from { transform: translate(-50%, -50%) scale(1); }
            to { transform: translate(-50%, -50%) scale(1.2); }
        }

        /* 타격 판정 플로팅 텍스트 */
        .floating-text {
            position: fixed;
            font-weight: 900;
            font-size: clamp(1.15rem, 4.6vw, 1.7rem);
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 2px 0 #000, 0 0 10px rgba(0, 0, 0, 0.6);
            z-index: 300;
            white-space: nowrap;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.5); }
        }

        /* ===== 상점 ===== */
        .shop-panel {
            background: var(--card);
            border: 3px solid var(--purple);
            border-radius: var(--radius);
            padding: clamp(10px, 2.6vw, 14px);
            width: min(100%, 30rem);
            margin: 0 auto clamp(10px, 2.6vw, 16px);
            box-shadow: 0 4px 0 rgba(124, 77, 255, 0.35);
            font-size: clamp(0.98rem, 3.4vw, 1.12rem);
            font-weight: bold;
        }

        .shop-btn {
            display: block;
            width: 100%;
            min-height: 48px;
            margin-top: 10px;
            background: linear-gradient(180deg, #9a72ff, #7c4dff);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 10px 14px;
            font-size: clamp(0.95rem, 3.3vw, 1.05rem);
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 0 #5a30d6;
            touch-action: manipulation;
        }

        .shop-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #5a30d6; }
        .shop-btn:disabled { background: #cfcbe0; box-shadow: 0 4px 0 #b3aecb; cursor: default; }

        /* ===== 게임판 ===== */
        .game-board {
            width: min(100%, var(--board-max));
            margin: 0 auto;
            background: linear-gradient(180deg, #85e56f 0%, #4cc95f 100%);
            border: clamp(4px, 1.4vw, 8px) solid #2fa14a;
            border-radius: clamp(14px, 3vw, 22px);
            padding: clamp(8px, 2.2vw, 16px);
            box-shadow: 0 8px 18px rgba(20, 60, 20, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.45);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        /* 피버 타임: 붉은 배경 위에서도 판이 확실히 튀도록 노란 테두리 */
        body.fever .game-board {
            border-color: #ffea00;
            box-shadow: 0 0 26px #ffea00, 0 0 60px rgba(255, 61, 0, 0.6);
        }

        .grid {
            display: grid;
            /* 세로 화면은 3열 x 4행 — 판이 세로로 길어져 폰 화면을 가득 채운다.
               가로로 눕히면 아래 landscape 규칙이 4열 x 3행으로 되돌린다. */
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap);
        }

        .hole {
            width: 100%;
            aspect-ratio: 1 / 1;
            container-type: inline-size; /* 두더지 얼굴 글자를 구멍 크기에 비례시키기 위함 */
            background: radial-gradient(circle at 50% 32%, #2b1a10 0%, #4a2e1c 68%, #63401f 100%);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: clamp(3px, 1vw, 5px) solid #a9714a;
            box-shadow: inset 0 8px 14px rgba(0, 0, 0, 0.75);
            touch-action: manipulation;
        }

        .mole {
            width: 82%;
            height: 84%;
            left: 9%;
            top: 100%;
            position: absolute;
            background:
                /* 밝은 주둥이 — 얼굴 아래쪽을 밝혀서 표정이 또렷해진다 */
                radial-gradient(ellipse at 50% 80%, rgba(255, 244, 226, 0.72) 0 24%, rgba(255, 244, 226, 0) 58%),
                linear-gradient(180deg, #e8b183 0%, #c98552 55%, #a96c40 100%);
            border-radius: 50% 50% 42% 42%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.9rem;  /* container query 미지원 브라우저 폴백 */
            font-size: 30cqw;
            color: #402512;
            box-shadow: inset -4px -6px 0 rgba(0, 0, 0, 0.12), 0 0 0 2px rgba(90, 56, 30, 0.35);
            transition: top 0.1s ease-out; /* 조금 더 민첩한 움직임 */
            touch-action: manipulation;
        }

        /* 귀 (클릭 판정은 .mole 이 그대로 받는다) */
        .mole::before,
        .mole::after {
            content: '';
            position: absolute;
            top: 0;
            width: 26%;
            height: 26%;
            border-radius: 50%;
            background: #a96c40;
        }

        .mole::before { left: 1%; }
        .mole::after { right: 1%; }

        .mole .face {
            /* position 을 주지 않는다 — 주는 순간 왕관/반짝임의 기준이 얼굴 글자로
               바뀌어 이마에 붙는다. flex 아이템은 static 이어도 z-index 가 먹으므로
               귀(::after) 위로 올리는 데는 z-index 만으로 충분하다. */
            z-index: 2;
            margin-top: -10%;
            pointer-events: none;
            letter-spacing: -0.04em;
        }

        .mole.gold {
            background:
                radial-gradient(ellipse at 50% 80%, rgba(255, 253, 230, 0.8) 0 24%, rgba(255, 253, 230, 0) 58%),
                linear-gradient(180deg, #fff3a0 0%, #ffd524 55%, #f7b500 100%);
            color: #6b4300;
            box-shadow: 0 0 18px rgba(255, 213, 36, 0.95), inset -4px -6px 0 rgba(0, 0, 0, 0.1), 0 0 0 2px rgba(150, 100, 0, 0.35);
        }

        .mole.gold::before,
        .mole.gold::after { background: #f2b705; }

        /* 황금 두더지에만 작은 왕관 + 머리 주변 반짝임.
           .face 의 가상 요소를 쓰므로 클릭 판정(.mole)에는 영향이 없다.
           크기 단위는 em — 얼굴 글자 크기(=구멍 크기)에 비례해서 같이 커진다. */
        .mole.gold .face::before {
            content: '👑';
            position: absolute;
            top: -8%;
            left: 50%;
            transform: translateX(-50%) rotate(-8deg);
            font-size: 0.6em;
            line-height: 1;
            filter: drop-shadow(0 1px 1px rgba(120, 80, 0, 0.5));
        }

        .mole.gold .face::after {
            content: '';
            position: absolute;
            top: 4%;
            left: 50%;
            width: 0.16em;
            height: 0.16em;
            border-radius: 50%;
            background: transparent;
            /* 흰 점 + 그 뒤에 짙은 호박색 테두리 점을 겹쳐 노란 몸통 위에서도 또렷하게.
               box-shadow 는 뒤에 적힌 것이 아래에 깔린다. */
            box-shadow:
                -0.92em  0.16em 0  0.00em #ffffff,
                 0.92em  0.22em 0 -0.02em #ffffff,
                -0.60em -0.30em 0 -0.02em #ffffff,
                 0.62em -0.26em 0 -0.01em #fffce0,
                -0.92em  0.16em 0  0.07em rgba(150, 92, 0, 0.5),
                 0.92em  0.22em 0  0.05em rgba(150, 92, 0, 0.5),
                -0.60em -0.30em 0  0.04em rgba(150, 92, 0, 0.45),
                 0.62em -0.26em 0  0.05em rgba(150, 92, 0, 0.45);
            animation: sparkle 1.2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.3; transform: scale(0.75); }
            50%      { opacity: 1;   transform: scale(1.2); }
        }

        .hole.up .mole { top: 8%; }

        /* ===== 시작 버튼 ===== */
        .start-btn {
            display: block;
            width: min(100%, 20rem);
            min-height: 58px;
            margin: clamp(12px, 3vw, 20px) auto 0;
            padding: 12px 24px;
            font-size: clamp(1.15rem, 4.2vw, 1.45rem);
            font-weight: 900;
            font-family: inherit;
            background: linear-gradient(180deg, #ffb03a, #ff7a1a);
            color: #fff;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 5px 0 #d1541b, 0 8px 16px rgba(0, 0, 0, 0.2);
            touch-action: manipulation;
        }

        .start-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #d1541b; }

        .start-btn:disabled {
            background: linear-gradient(180deg, #cfcbe0, #b3aecb);
            box-shadow: 0 5px 0 #9a95b5;
            cursor: default;
        }

        /* ===== 기록 / 글로벌 순위표 ===== */
        .score-section {
            max-width: 34rem;
            margin: clamp(20px, 5vw, 32px) auto 0;
            text-align: left;
        }

        .score-section h2 {
            font-size: clamp(1.15rem, 4.2vw, 1.5rem);
            color: #fff;
            text-shadow: -2px -2px 0 var(--deep-orange), 2px -2px 0 var(--deep-orange),
                         -2px 2px 0 var(--deep-orange), 2px 2px 0 var(--deep-orange),
                         0 4px 0 rgba(0, 0, 0, 0.18);
            margin: 0 0 clamp(8px, 2vw, 14px);
            text-align: center;
        }

        .lb-status {
            font-size: clamp(0.95rem, 3.4vw, 1.05rem);
            font-weight: bold;
            color: var(--ink-soft);
            background: var(--card);
            border-radius: 14px;
            padding: 14px 16px;
            text-align: center;
            margin: 0;
        }

        .lb-status.hidden { display: none; }

        #lb-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1.6vw, 10px);
        }

        .lb-row {
            display: grid;
            grid-template-columns: 2.6rem minmax(0, 1fr) auto;
            grid-template-areas: "rank name score" ". meta meta";
            align-items: center;
            gap: 2px clamp(6px, 2vw, 12px);
            background: var(--card);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 14px;
            padding: clamp(9px, 2.4vw, 12px) clamp(10px, 2.8vw, 16px);
            font-size: clamp(0.98rem, 3.5vw, 1.1rem);
            box-shadow: 0 3px 0 rgba(47, 42, 86, 0.12);
            color: var(--ink);
        }

        .lb-row-me {
            border-color: var(--yellow);
            background: #fff6da;
        }

        .lb-rank { grid-area: rank; font-weight: 900; text-align: center; font-size: 1.05em; }

        .lb-name {
            grid-area: name;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 3px 6px;
            min-width: 0;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .lb-score { grid-area: score; font-weight: 900; color: var(--deep-orange); white-space: nowrap; }
        .lb-meta { grid-area: meta; font-size: 0.82em; font-weight: bold; color: var(--ink-soft); }

        .lb-flag { font-size: 1.15em; }

        .lb-me {
            font-size: 0.72em;
            background: var(--purple);
            color: #fff;
            border-radius: 999px;
            padding: 2px 8px;
            font-weight: bold;
        }

        .lb-ip { font-size: 0.78em; color: #8b87a6; font-weight: normal; }

        /* ===== 게임 종료 결과 창 ===== */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(20, 10, 40, 0.68);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(12px, 4vw, 24px);
            z-index: 500;
            overflow-y: auto; /* 세로가 짧은 화면에서 결과 창을 스크롤로 볼 수 있게 */
            overscroll-behavior: contain;
        }

        .modal-backdrop.hidden { display: none; }

        .modal-card {
            background: linear-gradient(180deg, #fffdf6, #fff3d6);
            border: 4px solid var(--yellow);
            border-radius: 22px;
            padding: clamp(16px, 4.5vw, 26px);
            width: 100%;
            max-width: 24rem;
            margin: auto; /* 내용이 길어져도 위쪽이 잘리지 않게 */
            color: var(--ink);
            text-align: center;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
        }

        .modal-card h2 {
            margin: 0 0 6px;
            color: var(--deep-orange);
            font-size: clamp(1.3rem, 5vw, 1.6rem);
        }

        .result-score {
            font-size: clamp(2.4rem, 11vw, 3.2rem);
            font-weight: 900;
            color: var(--purple);
            margin: 4px 0 2px;
            line-height: 1.05;
        }

        /* "점" 글자만 작게 — #result-score 는 큰 크기를 유지한다. */
        .result-score span:last-child { font-size: 0.34em; color: var(--ink-soft); margin-left: 4px; }

        .result-detail {
            font-size: clamp(0.95rem, 3.6vw, 1.05rem);
            font-weight: bold;
            color: var(--ink-soft);
            margin: 0 0 4px;
        }

        .result-best {
            font-size: clamp(0.95rem, 3.6vw, 1.05rem);
            font-weight: bold;
            color: var(--deep-orange);
            margin: 0 0 16px;
        }

        .nickname-row { display: flex; flex-wrap: wrap; gap: 8px; }

        #nickname-input {
            flex: 3 1 8rem;
            min-width: 0;

            border: 3px solid #e6dcbe;

            font-weight: bold;
            font-family: inherit;
        }

        #nickname-input::placeholder { color: #a9a4c0; font-weight: normal; }
        #nickname-input:focus { outline: 3px solid rgba(124, 77, 255, 0.35); border-color: var(--purple); }
        #nickname-input:disabled { opacity: 0.55; }

        #submit-score-btn {
            flex: 1 1 5.5rem;
            min-height: 48px;
            padding: 10px 18px;

            background: linear-gradient(180deg, #ffb03a, #ff8a1a);

        #submit-score-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #d1541b; }
        #submit-score-btn:disabled { background: #cfcbe0; box-shadow: 0 4px 0 #b3aecb; cursor: not-allowed; }

        .submit-msg {

        #result-close-btn {

            font-size: 1.05rem;

        #result-close-btn:hover { border-color: var(--purple); color: var(--purple); }

        /* 넓은 화면은 글자/여백이 커져서 게임판 위아래가 더 필요하다 */
        @media (min-width: 700px) {
            :root { --ui-h: 29rem; }
        }

        /* 세로가 짧은 화면에서는 게임판이 최대한 첫 화면에 들어오도록 여백을 줄인다. */
        @media (max-height: 720px) {
            h1 { margin-bottom: 6px; }
            .info-panel { padding: 8px 10px; }
            .stat { padding: 3px 6px; }
            .best-line { margin-top: 6px; font-size: 0.86em; }
            .shop-panel { padding: 8px 10px; }
            .shop-btn { margin-top: 6px; min-height: 46px; }
            .start-btn { margin-top: 10px; min-height: 52px; }
        }

        /* 세로가 짧은 폰(640~720px): 위아래 UI를 최대한 눌러서 게임판을 키운다.
           여기서 줄인 만큼 --ui-h 도 같이 낮춰야 게임판 계산이 맞는다. */
        @media (max-width: 699px) and (max-height: 720px) {
            :root { --ui-h: 20rem; }

            h1 { font-size: clamp(1rem, 4.2vw, 1.25rem); margin-bottom: 4px; }
            .info-panel { padding: 6px 8px; margin-bottom: 6px; }
            .stat { padding: 2px 5px; }
            .stat-label { font-size: 0.68em; }
            .stat-value { font-size: 1.2em; }
            .best-line { margin-top: 3px; font-size: 0.78em; }
            .shop-panel { padding: 6px 8px; margin-bottom: 6px; font-size: 0.95rem; }
            .shop-btn { margin-top: 5px; min-height: 42px; }
            .start-btn { margin-top: 8px; min-height: 48px; }
        }

        /* 노트북(가로는 넓고 세로가 낮은 화면): 시작 버튼까지 한 화면에 들어오게 */
        @media (min-width: 700px) and (max-height: 950px) {
            h1 { margin-bottom: 8px; }
            .info-panel { padding: 10px 12px; margin-bottom: 10px; }
            .shop-panel { padding: 10px 12px; margin-bottom: 10px; }
            .start-btn { margin-top: 12px; }
        }

        @media (max-height: 560px) {
            #stage { padding-top: 46px; }
            h1 { font-size: clamp(1.05rem, 4vw, 1.35rem); }
            .shop-btn, .start-btn { min-height: 44px; }
        }

        /* ===== 가로로 눕힌 휴대폰 =====
           세로로 쌓으면 게임판이 화면 밖으로 밀린다.
           왼쪽에 정보/상점/시작 버튼, 오른쪽에 게임판을 놓아
           스크롤 없이 두 손 엄지로 바로 칠 수 있게 한다. */
        @media (orientation: landscape) and (max-height: 620px) {
            :root {
                /* 가로 모드에선 세로 길이가 게임판 크기를 결정한다 (판 비율 4:3) */
                --board-max: min(30rem, max(11rem, (100vh - 3rem) * 1.3));
                --board-max: min(30rem, max(11rem, (100svh - 3rem) * 1.3));
            }

            .back-link { top: 6px; left: 6px; min-height: 34px; padding: 0 11px; font-size: 0.85rem; }

            #stage {
                display: grid;
                grid-template-columns: minmax(9rem, 1fr) auto;
                grid-template-areas:
                    "title board"
                    "info  board"
                    "shop  board"
                    "start board";
                align-content: center;
                gap: 6px clamp(8px, 2vw, 16px);
                max-width: none;
                padding-top: 4px;
            }

            h1 {
                grid-area: title;
                margin: 34px 0 2px; /* 고정된 목록 링크 아래에서 시작 */
                font-size: clamp(0.95rem, 2.6vw, 1.3rem);
            }

            .info-panel { grid-area: info; width: 100%; margin: 0; padding: 8px 10px; }
            .shop-panel { grid-area: shop; width: 100%; margin: 0; padding: 8px 10px; }

            /* 좁은 왼쪽 칸에서도 세 칸이 한 줄에 들어가야 세로 높이가 안 늘어난다 */
            .stats { flex-wrap: nowrap; gap: 6px; }
            .stat { flex: 1 1 0; min-width: 0; padding: 2px 4px; }
            .stat-label { font-size: 0.68em; }
            .stat-value { font-size: 1.25em; }
            .best-line { margin-top: 4px; font-size: 0.82em; }
            .shop-btn { margin-top: 6px; min-height: 42px; }

            .start-btn {
                grid-area: start;
                width: 100%;
                min-height: 46px;
                margin: 6px 0 0;
            }

            /* 눕힌 화면에선 가로로 넓은 4열 x 3행이 잡기 편하다 */
            .grid { grid-template-columns: repeat(4, 1fr); }

            .game-board {
                grid-area: board;
                align-self: center;
                /* 왼쪽 칸을 짓누르지 않게 가로 폭도 함께 제한 */
                width: min(var(--board-max), 58vw);
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div class="fever-alert" id="fever-alert">🔥 FEVER 🔥</div>

    <div id="stage">
    <h1>🔨 두더지 잡기: 피버타임!</h1>
    
    <div class="info-panel">
        <div class="stats">
            <div class="stat stat-gold">
                <span class="stat-label">보유 골드</span>
                <span class="stat-value" id="gold">0</span><span class="stat-unit">G</span>
            </div>
            <div class="stat stat-score">
                <span class="stat-label">점수</span>
                <span class="stat-value" id="score">0</span>
            </div>
            <div class="stat stat-time">
                <span class="stat-label">남은 시간</span>
                <span class="stat-value" id="time">30</span><span class="stat-unit">초</span>
            </div>
        </div>
        <div class="best-line">🏅 내 최고 점수 <span id="best-score">0</span>점</div>
    </div>

    <div class="shop-panel">
        <div>현재 망치: <span id="hammer-name" style="color:#e2571a; font-weight:900;">돌 망치</span></div>
        <button class="shop-btn" id="upgrade-btn" onclick="upgradeHammer()">망치 업그레이드 (비용: 1000G)</button>
    </div>

    <div class="game-board">
        <div class="grid">
            <div class="hole"><div class="mole"><span class="face">⊙_⊙</span></div></div>
            <div class="hole"><div class="mole"><span class="face">⊙_⊙</span></div></div>
            <div class="hole"><div class="mole"><span class="face">⊙_⊙</span></div></div>
            <div class="hole"><div class="mole"><span class="face">⊙_⊙</span></div></div>
            <div class="hole"><div class="mole"><span class="face">⊙_⊙</span></div></div>
            <div class="hole"><div class="mole"><span class="face">⊙_⊙</span></div></div>
            <div class="hole"><div class="mole"><span class="face">⊙_⊙</span></div></div>
            <div class="hole"><div class="mole"><span class="face">⊙_⊙</span></div></div>
            <div class="hole"><div class="mole"><span class="face">⊙_⊙</span></div></div>
            <div class="hole"><div class="mole"><span class="face">⊙_⊙</span></div></div>
            <div class="hole"><div class="mole"><span class="face">⊙_⊙</span></div></div>
            <div class="hole"><div class="mole"><span class="face">⊙_⊙</span></div></div>
        </div>
    </div>

    <button class="start-btn" id="start-btn" onclick="startGame()">🎮 게임 시작</button>
    </div>

    <!-- 순위표는 #stage 밖에 둔다. 피버 타임에 흔들리면 읽기 어렵다. -->
    <section class="score-section">
        <h2>🏆 전 세계 TOP 10</h2>
        <p class="lb-status" id="lb-status">순위를 불러오는 중...</p>
        <ol id="lb-list"></ol>
    </section>

    <div class="modal-backdrop hidden" id="result-modal" role="dialog" aria-modal="true" aria-labelledby="result-title">
        <div class="modal-card">
            <h2 id="result-title">게임 종료!</h2>
            <p class="result-score"><span id="result-score">0</span><span>점</span></p>
            <p class="result-detail" id="result-detail"></p>
            <p class="result-best" id="result-best"></p>

            <div class="nickname-row">
                <input type="text" id="nickname-input" placeholder="닉네임 (12자까지)" autocomplete="off">
                <button type="button" id="submit-score-btn">기록 등록</button>
            </div>
            <p class="submit-msg" id="submit-msg"></p>

            <button type="button" id="result-close-btn">닫기</button>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/profanity.js"></script>
    <script src="js/cloud.js"></script>
    <script src="js/scoreboard.js"></script>

    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // BGM 로직
        let bgmTimer = null;
        let bgmNoteIndex = 0;
        let bgmIntervalTime = 200;
        const bgmMelody = [ 261.63, 329.63, 392.00, 523.25, 440.00, 392.00, 329.63, 293.66, 261.63, 329.63, 392.00, 440.00, 523.25, 493.88, 440.00, 392.00 ];

        function playBGMNote() {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const freq = bgmMelody[bgmNoteIndex];
            bgmNoteIndex = (bgmNoteIndex + 1) % bgmMelody.length;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (bgmIntervalTime / 1000) * 0.9);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + (bgmIntervalTime / 1000) * 0.9);
        }

        function startBGM() {
            stopBGM();
            bgmNoteIndex = 0;
            bgmIntervalTime = 220;
            bgmTimer = setInterval(playBGMNote, bgmIntervalTime);
        }

        function setFeverBGM() {
            bgmIntervalTime = 90; // 미친듯한 속도로 변경
            clearInterval(bgmTimer);
            bgmTimer = setInterval(playBGMNote, bgmIntervalTime);
        }

        function stopBGM() {
            if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'hit') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'jaws') { // 죠스 긴박음
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(60, now);
                osc.frequency.setValueAtTime(100, now + 0.2);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        // 표정 정의
        const FACES = { UP: "⊙_⊙", HIT: ">_<", MISS: "ㅋㅋㅋ" };

        const holes = document.querySelectorAll('.hole');
        const scoreDisplay = document.querySelector('#score');
        const goldDisplay = document.querySelector('#gold');
        const timeDisplay = document.querySelector('#time');
        const startBtn = document.querySelector('#start-btn');
        const feverAlert = document.querySelector('#fever-alert');
        
        let timeUp = false;
        let score = 0;
        let hits = 0;      // 이번 판에 잡은 두더지 수
        let perfects = 0;  // 이번 판 PERFECT 판정 수
        let totalGold = parseInt(localStorage.getItem('moleGold')) || 0;
        let timeLeft = 30; // 30초로 증가
        let countdownTimer;
        let peepTimeout;
        let feverMode = false;

        let hammerLevel = parseInt(localStorage.getItem('hammerLevel')) || 1;
        const hammerData = [
            { name: "돌 망치", duration: [1100, 1600], cost: 1000 },
            { name: "목재 망치 (가벼움)", duration: [1300, 1800], cost: 3000 },
            { name: "깃털 망치 (최고 속도!)", duration: [1600, 2200], cost: 0 }
        ];

        goldDisplay.textContent = totalGold;
        updateShopUI();

        function updateShopUI() {
            const current = hammerData[hammerLevel - 1];
            document.querySelector('#hammer-name').textContent = current.name;
            const upgradeBtn = document.querySelector('#upgrade-btn');
            
            if (hammerLevel >= hammerData.length) {
                upgradeBtn.textContent = "최고 단계 달성!";
                upgradeBtn.disabled = true;
            } else {
                upgradeBtn.textContent = `망치 업그레이드 (${current.cost}G)`;
                upgradeBtn.disabled = totalGold < current.cost;
            }
        }

        function upgradeHammer() {
            const current = hammerData[hammerLevel - 1];
            if (totalGold >= current.cost && hammerLevel < hammerData.length) {
                totalGold -= current.cost;
                hammerLevel++;
                localStorage.setItem('moleGold', totalGold);
                localStorage.setItem('hammerLevel', hammerLevel);
                goldDisplay.textContent = totalGold;
                updateShopUI();
            }
        }

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        // 플로팅 점수 & 판정 텍스트 생성
        function createFloatingText(x, y, text, color) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            el.style.left = `${x - 20}px`;
            el.style.top = `${y - 20}px`;
            el.style.color = color;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function schedulePeep() {
            if (timeUp) return;

            const currentHammer = hammerData[hammerLevel - 1];
            // 피버 타임일 땐 쉬는 시간 거의 없이 계속 나타남
            const delay = feverMode ? randomTime(100, 300) : randomTime(400, 800);

            peepTimeout = setTimeout(() => {
                if (timeUp) return;

                // 일반 모드는 1마리, 피버 타임은 2~4마리 동시 출현
                let count = feverMode ? (Math.floor(Math.random() * 3) + 2) : 1; 

                // 현재 비어있는 구멍 찾기
                const availableHoles = Array.from(holes).filter(h => !h.classList.contains('up'));
                
                for(let i=0; i < count && availableHoles.length > 0; i++) {
                    const idx = Math.floor(Math.random() * availableHoles.length);
                    const hole = availableHoles.splice(idx, 1)[0];
                    const mole = hole.querySelector('.mole');
                    const face = mole.querySelector('.face');

                    face.textContent = FACES.UP;
                    mole.dataset.hit = "false";
                    mole.dataset.appearTime = Date.now(); // 등장 시간 기록 (반응속도 측정용)

                    // 피버 타임엔 황금 두더지 50% 확률!
                    const isGold = Math.random() < (feverMode ? 0.5 : 0.2);
                    mole.className = 'mole' + (isGold ? ' gold' : '');
                    mole.dataset.basePoints = isGold ? "300" : "100";

                    hole.classList.add('up');

                    // 피버 타임엔 두더지가 머무는 시간도 극단적으로 랜덤해짐 (짧음~긺 섞임)
                    let stayTime = randomTime(currentHammer.duration[0], currentHammer.duration[1]);
                    if (feverMode) stayTime = randomTime(400, 1200);

                    setTimeout(() => {
                        if (mole.dataset.hit === "false") {
                            face.textContent = FACES.MISS;
                        }
                        setTimeout(() => hole.classList.remove('up'), 200);
                    }, stayTime);
                }

                schedulePeep();
            }, delay);
        }

        function startGame() {
            initAudio();
            startBGM();
            clearTimeout(peepTimeout);

            score = 0;
            hits = 0;
            perfects = 0;
            timeLeft = 30;
            timeUp = false;
            feverMode = false;
            
            scoreDisplay.textContent = 0;
            timeDisplay.textContent = timeLeft;
            startBtn.disabled = true;
            document.body.classList.remove('fever');
            feverAlert.classList.remove('show');

            schedulePeep();

            countdownTimer = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;

                // 남은 시간 7초: 피버 타임 진입
                if (timeLeft === 7) {
                    feverMode = true;
                    document.body.classList.add('fever');
                    feverAlert.classList.add('show');
                    playSound('jaws'); // 피버 시작 알림
                    setFeverBGM();     // BGM 템포 폭주
                }

                // 남은 시간 4초: 죠스음 한 번 더 강조
                if (timeLeft === 4) {
                    playSound('jaws');
                }

                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    stopBGM();
                    timeUp = true;
                    startBtn.disabled = false;
                    document.body.classList.remove('fever');
                    feverAlert.classList.remove('show');

                    totalGold += score;
                    localStorage.setItem('moleGold', totalGold);
                    goldDisplay.textContent = totalGold;
                    updateShopUI();

                    // 결과 창에서 기록 등록까지 진행한다.
                    setTimeout(() => ScoreBoard.onGameEnd({
                        score: score,
                        hits: hits,
                        perfects: perfects,
                        hammer: hammerData[hammerLevel - 1].name
                    }), 300);
                }
            }, 1000);
        }

        function bonk(e) {
            if (!e.isTrusted || this.dataset.hit === "true") return;
            
            this.dataset.hit = "true";
            this.querySelector('.face').textContent = FACES.HIT;
            playSound('hit');

            // 반응 속도에 따른 점수 차등 지급 계산
            const reactionTime = Date.now() - parseInt(this.dataset.appearTime);
            const basePoints = parseInt(this.dataset.basePoints) || 100;
            
            let multiplier = 1;
            let textMsg = "GOOD!";
            let textColor = "#fff";

            if (reactionTime < 450) {
                multiplier = 2.0;       // 0.45초 이내면 점수 2배
                textMsg = "PERFECT!";
                textColor = "#ff4081";
                perfects++;
            } else if (reactionTime < 750) {
                multiplier = 1.5;       // 0.75초 이내면 점수 1.5배
                textMsg = "GREAT!";
                textColor = "#03a9f4";
            }

            const finalPoints = Math.floor(basePoints * multiplier);
            score += finalPoints;
            hits++;
            scoreDisplay.textContent = score;

            // 마우스 위치에 점수 및 판정 텍스트 띄우기
            createFloatingText(e.clientX, e.clientY, `${textMsg} +${finalPoints}`, textColor);

            setTimeout(() => this.parentNode.classList.remove('up'), 150);
        }

        // 터치(멀티터치)·마우스·펜을 한 번에 받는다.
        // mousedown 만 쓰면 모바일에서 두 손가락으로 두 마리를 동시에 때릴 수 없고,
        // 합성 mousedown 이 늦게 도착해서 반응 속도 판정(PERFECT)에서도 손해를 본다.
        document.querySelectorAll('.mole').forEach(mole => {
            mole.addEventListener('pointerdown', bonk);
            // 길게 누를 때 뜨는 컨텍스트 메뉴 방지
            mole.addEventListener('contextmenu', e => e.preventDefault());
        });
    </script>
